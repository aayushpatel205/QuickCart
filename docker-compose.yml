# ─────────────────────────────────────────────────────────────────────────────
# QuickCart – Docker Hub version (replace image names with your Docker Hub IDs)
# Run: docker compose -f docker-compose-hub.yml up
# ─────────────────────────────────────────────────────────────────────────────

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - quickcart-net

services:

  # ── Infrastructure: Databases ──────────────────────────────────────────────

  orderdb:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: orderdb
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    ports:
      - "5433:5432"
    volumes:
      - orderdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderuser -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  paymentdb:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: paymentdb
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: paymentuser
      POSTGRES_PASSWORD: paymentpass
    ports:
      - "5434:5432"
    volumes:
      - paymentdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentuser -d paymentdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  deliverydb:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: deliverydb
    environment:
      POSTGRES_DB: deliverydb
      POSTGRES_USER: deliveryuser
      POSTGRES_PASSWORD: deliverypass
    ports:
      - "5435:5432"
    volumes:
      - deliverydb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliveryuser -d deliverydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  restaurantdb:
    <<: *service-defaults
    image: mongo:7.0
    container_name: restaurantdb
    environment:
      MONGO_INITDB_DATABASE: restaurantdb
    ports:
      - "27017:27017"
    volumes:
      - restaurantdb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *service-defaults
    image: redis:7.2-alpine
    container_name: redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Infrastructure: Messaging ──────────────────────────────────────────────

  zookeeper:
    <<: *service-defaults
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    <<: *service-defaults
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order.created --partitions 3 --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order.confirmed --partitions 3 --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order.cancelled --partitions 3 --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.completed --partitions 3 --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.failed --partitions 3 --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic delivery.assigned --partitions 3 --replication-factor 1 &&
       echo 'Kafka topics created successfully'"
    networks:
      - quickcart-net

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 15s
      timeout: 10s
      retries: 10

  # ── API Gateway: Kong ──────────────────────────────────────────────────────

  kong:
    <<: *service-defaults
    image: kong:3.7-ubuntu
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yaml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8080:8000"
      - "8001:8001"
    volumes:
      - ./infra/kong/kong.yaml:/etc/kong/kong.yaml:ro
    depends_on:
      - order-service
      - restaurant-service
      - payment-service
      - delivery-service
      - cart-notification

  # ── Observability ──────────────────────────────────────────────────────────

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    <<: *service-defaults
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

  loki:
    <<: *service-defaults
    image: grafana/loki:2.9.8
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  # ── Microservices (pulled from Docker Hub) ─────────────────────────────────
  # IMPORTANT: Replace DOCKERHUB_USERNAME with each teammate's Docker Hub username

  order-service:
    <<: *service-defaults
    image: aayushp255/order-service:latest   # <-- Replace this
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://orderdb:5432/orderdb
      SPRING_DATASOURCE_USERNAME: orderuser
      SPRING_DATASOURCE_PASSWORD: orderpass
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      GRPC_RESTAURANT_HOST: restaurant-service
      GRPC_RESTAURANT_PORT: 50051
    depends_on:
      orderdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  restaurant-service:
    <<: *service-defaults
    image: tirthchaklasiya19/restaurant-service:latest   # <-- Replace this
    container_name: restaurant-service
    ports:
      - "8082:8082"
      - "50051:50051"
    environment:
      MONGODB_URI: mongodb://restaurantdb:27017/restaurantdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      restaurantdb:
        condition: service_healthy

  payment-service:
    <<: *service-defaults
    image: harshkumar1601/payment-service:latest   # <-- Replace this
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgresql://paymentuser:paymentpass@paymentdb:5432/paymentdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      paymentdb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  delivery-service:
    <<: *service-defaults
    image: adityathakar/delivery-service:v1   # <-- Replace this
    container_name: delivery-service
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: postgresql://deliveryuser:deliverypass@deliverydb:5432/deliverydb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      deliverydb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cart-notification:
    <<: *service-defaults
    image: krishbhasvar/cart-notification:latest   # <-- Replace this (your service)
    container_name: cart-notification
    ports:
      - "8085:8085"
    environment:
      Redis__ConnectionString: redis:6379
      Kafka__BootstrapServers: kafka:9092
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      OrderService__BaseUrl: http://order-service:8081
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  quickcart-net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  orderdb-data:
  paymentdb-data:
  deliverydb-data:
  restaurantdb-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  loki-data:

