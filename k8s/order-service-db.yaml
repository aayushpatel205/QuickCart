apiVersion: v1
kind: ConfigMap
metadata:
  name: order-db-config
  namespace: quickcart
data:
  POSTGRES_DB: orderdb
  POSTGRES_USER: orderuser
  POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-db-data
  namespace: quickcart
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-db
  namespace: quickcart
spec:
  serviceName: order-db
  replicas: 1
  selector:
    matchLabels:
      app: order-db
  template:
    metadata:
      labels:
        app: order-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - wal_level=logical
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: order-db-config
            - secretRef:
                name: order-service-secret
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - orderuser
                - -d
                - orderdb
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - orderuser
                - -d
                - orderdb
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: order-db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: order-db-data
          persistentVolumeClaim:
            claimName: order-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: order-db
  namespace: quickcart
spec:
  selector:
    app: order-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
