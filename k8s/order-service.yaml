apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: quickcart
data:
  SERVER_PORT: "8081"
  DB_URL: jdbc:postgresql://order-db:5432/orderdb
  DB_USER: orderuser
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: guest
  RESTAURANT_GRPC_HOST: restaurant-service
  RESTAURANT_GRPC_PORT: "50051"
  RABBITMQ_NOTIFICATION_EXCHANGE: quickcart.notifications
  RABBITMQ_NOTIFICATION_QUEUE: notification.queue
  RABBITMQ_NOTIFICATION_DLQ: notification.dlq
  RABBITMQ_NOTIFICATION_ROUTING_KEY: notification
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-sidecar-config
  namespace: quickcart
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: order-service-local
        metrics_path: /metrics
        static_configs:
          - targets: ["localhost:8081"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: quickcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: aayushp255/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secret
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
        - name: metrics-sidecar
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.listen-address=:9090
          ports:
            - name: sidecar-http
              containerPort: 9090
          volumeMounts:
            - name: sidecar-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: sidecar-config
          configMap:
            name: order-service-sidecar-config
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: quickcart
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8081
      targetPort: http
    - name: metrics-sidecar
      port: 9090
      targetPort: sidecar-http
