apiVersion: v1
kind: Secret
metadata:
  name: kong-tls-cert
  namespace: quickcart
  labels:
    app.kubernetes.io/name: kong-gateway
    app.kubernetes.io/part-of: quickcart
type: kubernetes.io/tls
# To generate self-signed certificates locally, execute:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt \
#     -subj "/CN=api.quickcart.local/O=QuickCart"
# Then apply via:
#   kubectl create secret tls kong-tls-cert --cert=tls.crt --key=tls.key -n quickcart --dry-run=client -o yaml
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    MIIDAzCCAc2gAwIBAgIUQ1VJQ0tDQVJUU0VMRlNJR05FRDAXDTIONjEwMTIwNjQ1
    MDBaFw0yNzEwMTIwNjQ1MDBaMCAxHjAcBgNVBAMMFWFwaS5xdWlja2NhcnQubG9j
    YWwwggEiMA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQC78JjV3wZ0+b7eY/8q
    -----END CERTIFICATE-----
  tls.key: |
