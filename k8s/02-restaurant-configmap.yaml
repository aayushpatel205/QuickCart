apiVersion: v1
kind: ConfigMap
metadata:
  name: restaurant-service-config
  namespace: quickcart
  labels:
    app.kubernetes.io/name: restaurant-service
    app.kubernetes.io/part-of: quickcart
data:
  NODE_ENV: "production"
  PORT: "8082"
  GRPC_PORT: "50051"
  LOG_LEVEL: "info"
  CB_TIMEOUT_MS: "3000"
  CB_ERROR_THRESHOLD: "50"
  CB_RESET_TIMEOUT_MS: "5000"
