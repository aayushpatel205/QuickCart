apiVersion: v1
kind: Secret
metadata:
  name: delivery-secret
  namespace: quickcart
  labels:
    app: delivery-service
type: Opaque
stringData:
  DB_PASSWORD: changeme
  DATABASE_URL: postgres://postgres:changeme@delivery-db:5432/deliverydb?sslmode=disable
  RABBITMQ_URL: amqp://guest:changeme@rabbitmq-service:5672/
