apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: quickcart
  labels:
    app.kubernetes.io/name: restaurant-service
    app.kubernetes.io/part-of: quickcart
spec:
  type: ClusterIP
  selector:
    app: restaurant-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
