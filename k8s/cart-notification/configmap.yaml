apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-notification-config
  namespace: quickcart
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8085"
  Redis__ConnectionString: "redis-service:6379"
  Kafka__BootstrapServers: "kafka-service:9092"
  RabbitMQ__Host: "rabbitmq-service"
  RabbitMQ__Port: "5672"
  OrderService__BaseUrl: "http://order-service:8081"
