apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: quickcart
  labels:
    app: delivery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: /metrics
    spec:
      volumes:
        - name: app-logs
          emptyDir: {}
        - name: promtail-config
          configMap:
            name: delivery-promtail-sidecar-config
      containers:
        - name: delivery-service
          image: quickcartteam/delivery-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          envFrom:
            - configMapRef:
                name: delivery-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: delivery-secret
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: delivery-secret
                  key: RABBITMQ_URL
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/delivery-service
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: promtail-sidecar
          image: grafana/promtail:2.9.0
          args:
            - -config.file=/etc/promtail/promtail.yaml
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/delivery-service
              readOnly: true
            - name: promtail-config
              mountPath: /etc/promtail
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: quickcart
  labels:
    app: delivery-service
spec:
  type: ClusterIP
  selector:
    app: delivery-service
  ports:
    - name: http
      port: 8084
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-config
  namespace: quickcart
  labels:
    app: delivery-service
data:
  PORT: "8084"
  SERVICE_NAME: delivery-service
  KAFKA_BROKERS: kafka:9092
  LOG_FILE_PATH: /var/log/delivery-service/app.log
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-promtail-sidecar-config
  namespace: quickcart
  labels:
    app: delivery-service
data:
  promtail.yaml: |
    server:
      http_listen_port: 0
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: delivery-service-file
        static_configs:
          - targets: [localhost]
            labels:
              app: delivery-service
              namespace: quickcart
              source: sidecar
              __path__: /var/log/delivery-service/*.log
        pipeline_stages:
          - json:
              expressions:
                level: level
                service: service
                orderId: orderId
                correlationId: correlationId
          - labels:
              level:
              service:
