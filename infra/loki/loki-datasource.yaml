# Grafana provisioning ConfigMap — auto-registers Loki as a datasource.
# Mount this into Grafana at /etc/grafana/provisioning/datasources/
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-datasource
  namespace: quickcart
  labels:
    app: grafana
    grafana_datasource: "true"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        editable: true
        jsonData:
          maxLines: 1000
