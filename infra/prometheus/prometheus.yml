global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'order-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['order-service:8081']

  - job_name: 'restaurant-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['restaurant-service:8082']

  - job_name: 'payment-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['payment-service:8083']

  - job_name: 'delivery-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['delivery-service:8084']

  - job_name: 'cart-notification'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cart-notification:8085']
