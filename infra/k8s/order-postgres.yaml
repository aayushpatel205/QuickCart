apiVersion: v1
kind: ConfigMap
metadata:
  name: order-db-config
  namespace: quickcart
data:
  POSTGRES_DB: orderdb
  POSTGRES_USER: orderuser
  POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
  namespace: quickcart
type: Opaque
stringData:
  POSTGRES_PASSWORD: changeme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-db
  namespace: quickcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-db
  template:
    metadata:
      labels:
        app: order-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "wal_level=logical"]
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: order-db-config
            - secretRef:
                name: order-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: order-db
  namespace: quickcart
spec:
  selector:
    app: order-db
  ports:
    - port: 5432
      targetPort: 5432
