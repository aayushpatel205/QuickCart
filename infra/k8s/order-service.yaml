apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: quickcart
data:
  SERVER_PORT: "8081"
  DB_URL: jdbc:postgresql://order-db:5432/orderdb
  DB_USER: orderuser
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: guest
  RESTAURANT_GRPC_HOST: restaurant-service
  RESTAURANT_GRPC_PORT: "50051"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-sidecar-config
  namespace: quickcart
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: order-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["localhost:8081"]
---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  namespace: quickcart
type: Opaque
stringData:
  DB_PASSWORD: changeme
  RABBITMQ_PASSWORD: changeme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: quickcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: app
          image: aayushp255/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
        - name: sidecar
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.listen-address=:9090
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: sidecar-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: sidecar-config
          configMap:
            name: order-service-sidecar-config
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: quickcart
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
