syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.quickcart.restaurant.grpc";
option java_outer_classname = "MenuProto";

package quickcart.restaurant;

service MenuService {
  rpc ValidateItems(ValidateRequest) returns (ValidateResponse);
}

message ValidateRequest {
  string restaurantId = 1;
  repeated Item items = 2;
}

message Item {
  string itemId = 1;
  int32 qty = 2;
}

message ValidateResponse {
  bool valid = 1;
  double totalPrice = 2;
  string message = 3;
}
