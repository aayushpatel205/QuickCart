# k8s/secret.yaml – DB password stored as Kubernetes Secret
# In production: use sealed-secrets or external-secrets-operator, NOT plain base64.
# Values here are base64 of "payment_pass" and "payment_user"
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secret
  namespace: quickcart
  labels:
    app: payment-service
type: Opaque
data:
  # echo -n 'payment_pass' | base64
  DB_PASSWORD: cGF5bWVudF9wYXNz
  # echo -n 'payment_user' | base64
  DB_USER: cGF5bWVudF91c2Vy
