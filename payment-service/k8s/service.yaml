# k8s/service.yaml – ClusterIP service for payment-service
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: quickcart
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      protocol: TCP
      port: 8083
      targetPort: 8083
  type: ClusterIP
