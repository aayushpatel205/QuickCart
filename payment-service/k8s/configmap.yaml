# k8s/configmap.yaml – non-secret environment configuration for payment-service
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: quickcart
  labels:
    app: payment-service
data:
  DB_HOST: "payment-postgres"
  DB_PORT: "5432"
  DB_NAME: "paymentdb"
  DB_USER: "payment_user"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_CONSUMER_GROUP: "payment-service"
  KAFKA_TOPIC_ORDER_CREATED: "order.created"
  KAFKA_TOPIC_PAYMENT_COMPLETED: "payment.completed"
  KAFKA_TOPIC_PAYMENT_FAILED: "payment.failed"
  PAYMENT_SUCCESS_THRESHOLD_AMOUNT: "5000"
  PAYMENT_RANDOM_FAIL_PERCENT: "10"
  CB_FAIL_MAX: "5"
  CB_RESET_TIMEOUT: "60"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
