# monitoring/prometheus-deployment.yaml
# Deploys Prometheus into the quickcart namespace with the config and rules as ConfigMaps

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: quickcart
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: "order-service"
        metrics_path: "/actuator/prometheus"
        static_configs:
          - targets: ["order-service:8081"]
      - job_name: "restaurant-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["restaurant-service:8082"]
      - job_name: "payment-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["payment-service:8083"]
      - job_name: "delivery-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["delivery-service:8084"]
      - job_name: "cart-notification"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["cart-notification:8085"]
      - job_name: "kong"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["kong:8001"]
      - job_name: "kafka-exporter"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["kafka-exporter:9308"]

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: quickcart
data:
  alert_rules.yml: |
    groups:
      - name: quickcart.service_health
        interval: 30s
        rules:
          - alert: ServiceDown
            expr: up{job=~"order-service|restaurant-service|payment-service|delivery-service|cart-notification"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is DOWN"
          - alert: HighErrorRate
            expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High error rate on {{ $labels.service }}"
          - alert: PaymentFailureSpike
            expr: rate(payments_total{status="FAILED"}[5m]) / (rate(payments_total[5m]) + 0.001) > 0.20
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Payment failure rate above 20%"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: quickcart
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534      # nobody
        fsGroup: 65534
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"
            - "--web.listen-address=:9090"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules/alert_rules.yml
              subPath: alert_rules.yml
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}          # use PersistentVolumeClaim in production

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: quickcart
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  type: ClusterIP

---
# RBAC: allow Prometheus to scrape pod annotations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: quickcart

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: quickcart
